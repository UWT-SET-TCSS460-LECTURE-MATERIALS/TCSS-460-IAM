services:
    - type: web
      name: auth-squared
      runtime: node
      plan: free
      buildCommand: npm ci --include=dev && npm run build && npx prisma migrate deploy
      startCommand: npm run start
      healthCheckPath: /health
      envVars:
          # Set DATABASE_URL manually in Render dashboard to reuse existing DB
          # (internal URL from your existing Render PostgreSQL instance)
          - key: DATABASE_URL
            sync: false
          - key: JWT_SECRET
            sync: false
          - key: NODE_ENV
            value: production
          - key: PORT
            value: '8000'
          - key: SEND_EMAILS
            value: 'false'
          - key: APP_BASE_URL
            sync: false
