<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="300" height="300" preserveAspectRatio="xMidYMid meet" style="cursor: pointer;">
    <!-- Shield shape -->
    <path d="M 200 50 L 320 100 L 320 220 Q 320 300, 200 350 Q 80 300, 80 220 L 80 100 Z" fill="#4b2e83" stroke="#85754d" stroke-width="6"/>

    <!-- Inner shield -->
    <path d="M 200 80 L 290 120 L 290 210 Q 290 270, 200 310 Q 110 270, 110 210 L 110 120 Z" fill="white" opacity="0.95"/>

    <!-- Lock icon -->
    <rect x="170" y="152" width="60" height="50" rx="8" fill="#85754d"/>
    <path d="M 185 152 Q 185 132, 200 132 Q 215 132, 215 152" stroke="#85754d" stroke-width="10" fill="none" stroke-linecap="round"/>

    <!-- Keyhole -->
    <circle cx="200" cy="172" r="6" fill="#4b2e83"/>
    <rect x="197" y="172" width="6" height="15" fill="#4b2e83"/>

    <!-- AUTH with aligned ² -->
    <text x="200" y="243" font-family="Arial Black" font-size="42" text-anchor="middle" fill="#4b2e83">AUTH</text>

    <!-- Bold ² -->
    <text x="263" y="223" font-family="Arial Black" font-size="24" font-weight="bold" fill="#85754d">2</text>
</svg>