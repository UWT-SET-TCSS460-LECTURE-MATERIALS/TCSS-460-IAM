                                type: object
                                properties:
                                    success:
                                        type: boolean
                                    data:
                                        type: object
                                        properties:
                                            clients:
                                                type: array
                                                items:
                                                    $ref: '#/components/schemas/OAuthClient'
                '401':
                    $ref: '#/components/responses/UnauthorizedError'
                '403':
                    $ref: '#/components/responses/ForbiddenError'
                '404':
                    $ref: '#/components/responses/NotFoundError'
                '500':
                    $ref: '#/components/responses/ServerError'

        post:
            tags:
                - Tenant Admin
            summary: Create OAuth client
            description: |
                Creates a new OAuth client for the tenant. Returns the generated `clientId` and
                `clientSecret`. The secret is only shown once — store it securely.

                **Requires:** Owner role (level 5).
            operationId: createTenantClient
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/TenantId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - clientName
                                - redirectUris
                            properties:
                                clientName:
                                    type: string
                                    description: Human-readable name for this client
                                    example: 'Group 1 Consumer App'
                                redirectUris:
                                    type: array
                                    items:
                                        type: string
                                        format: uri
                                    description: Allowed redirect URIs
                                    example:
                                        - http://localhost:3000/api/auth/callback/tcss460
                                        - https://group1-app.onrender.com/api/auth/callback/tcss460
            responses:
                '201':
                    description: Client created (secret shown once)
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                    data:
                                        type: object
                                        properties:
                                            client:
                                                $ref: '#/components/schemas/OAuthClient'
                                            clientSecret:
                                                type: string
                                                description: 'Client secret — only shown once, store securely'
                                                example: 'cs_a1b2c3d4e5f6...'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/UnauthorizedError'
                '403':
                    $ref: '#/components/responses/ForbiddenError'
                '404':
                    $ref: '#/components/responses/NotFoundError'
                '500':
                    $ref: '#/components/responses/ServerError'

    /admin/tenants/{tenantId}/clients/{clientId}:
        put:
            tags:
                - Tenant Admin
            summary: Update OAuth client
            description: |
                Updates an OAuth client's name or redirect URIs.

                **Requires:** Owner role (level 5).
            operationId: updateTenantClient
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/TenantId'
                - $ref: '#/components/parameters/ClientId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                clientName:
                                    type: string
                                redirectUris:
                                    type: array
                                    items:
                                        type: string
                                        format: uri
            responses:
                '200':
                    description: Client updated
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                    data:
                                        type: object
                                        properties:
                                            client:
                                                $ref: '#/components/schemas/OAuthClient'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/UnauthorizedError'
                '403':
                    $ref: '#/components/responses/ForbiddenError'
                '404':
                    $ref: '#/components/responses/NotFoundError'
                '500':
                    $ref: '#/components/responses/ServerError'

        delete:
            tags:
                - Tenant Admin
            summary: Delete OAuth client
            description: |
                Permanently deletes an OAuth client. All associated authorization codes are invalidated.

                **Requires:** Owner role (level 5).
            operationId: deleteTenantClient
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/TenantId'
                - $ref: '#/components/parameters/ClientId'
            responses:
                '200':
                    description: Client deleted
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessResponse'
                '401':
                    $ref: '#/components/responses/UnauthorizedError'
                '403':
                    $ref: '#/components/responses/ForbiddenError'
                '404':
                    $ref: '#/components/responses/NotFoundError'
                '500':
                    $ref: '#/components/responses/ServerError'

    /admin/tenants/{tenantId}/clients/{clientId}/rotate:
        post:
            tags:
                - Tenant Admin
            summary: Rotate client secret
            description: |
                Generates a new client secret, invalidating the old one. The new secret is
                returned once — store it securely.

                **Requires:** Owner role (level 5).
            operationId: rotateTenantClientSecret
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/TenantId'
                - $ref: '#/components/parameters/ClientId'
            responses:
                '200':
                    description: Secret rotated (new secret shown once)
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                    data:
                                        type: object
                                        properties:
                                            clientId:
                                                type: string
                                            clientSecret:
                                                type: string
                                                description: 'New client secret — only shown once'
                '401':
                    $ref: '#/components/responses/UnauthorizedError'
                '403':
                    $ref: '#/components/responses/ForbiddenError'
                '404':
                    $ref: '#/components/responses/NotFoundError'
                '500':
                    $ref: '#/components/responses/ServerError'

    /admin/tenants/{tenantId}/members:
        get:
            tags:
                - Tenant Admin
            summary: List tenant members (paginated)
            description: |
                Returns paginated list of users who have membership in the specified tenant,
                along with their tenant-specific roles.

                **Requires:** Owner role (level 5).
            operationId: listTenantMembers
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/TenantId'
                - name: page
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      default: 1
                  description: Page number
                - name: limit
                  in: query
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 20
                  description: Items per page
            responses:
                '200':
                    description: Members retrieved
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                    data:
                                        type: object
                                        properties:
                                            members:
                                                type: array
                                                items:
                                                    $ref: '#/components/schemas/TenantMember'
                                            pagination:
                                                $ref: '#/components/schemas/PaginationMeta'
                '401':
                    $ref: '#/components/responses/UnauthorizedError'
                '403':
                    $ref: '#/components/responses/ForbiddenError'
                '404':
                    $ref: '#/components/responses/NotFoundError'
                '500':
                    $ref: '#/components/responses/ServerError'

        post:
            tags:
                - Tenant Admin
            summary: Add member to tenant
            description: |
                Adds a user to the tenant with a specified role. The user is identified by email
                and must already have a global account.

                **Requires:** Owner role (level 5).
            operationId: addTenantMember
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/TenantId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - email
                                - role
                            properties:
                                email:
                                    type: string
                                    format: email
                                    description: Email of the existing user to add
                                    example: student@example.com
                                role:
                                    type: integer
                                    minimum: 1
                                    maximum: 5
                                    description: Tenant-specific role level
                                    example: 1
            responses:
                '201':
                    description: Member added
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                    data:
                                        type: object
                                        properties:
                                            member:
                                                $ref: '#/components/schemas/TenantMember'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/UnauthorizedError'
                '403':
                    $ref: '#/components/responses/ForbiddenError'
                '404':
                    $ref: '#/components/responses/NotFoundError'
                '500':
                    $ref: '#/components/responses/ServerError'

    /admin/tenants/{tenantId}/members/{accountId}:
        put:
            tags:
                - Tenant Admin
            summary: Update member role
            description: |
                Changes a member's role within the tenant.

                **Requires:** Owner role (level 5).
            operationId: updateTenantMember
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/TenantId'
                - $ref: '#/components/parameters/AccountId'
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - role
                            properties:
                                role:
                                    type: integer
                                    minimum: 1
                                    maximum: 5
                                    description: New tenant-specific role level
                                    example: 2
            responses:
                '200':
                    description: Member role updated
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    success:
                                        type: boolean
                                    data:
                                        type: object
                                        properties:
                                            member:
                                                $ref: '#/components/schemas/TenantMember'
                '400':
                    $ref: '#/components/responses/ValidationError'
                '401':
                    $ref: '#/components/responses/UnauthorizedError'
                '403':
                    $ref: '#/components/responses/ForbiddenError'
                '404':
                    $ref: '#/components/responses/NotFoundError'
                '500':
                    $ref: '#/components/responses/ServerError'

        delete:
            tags:
                - Tenant Admin
            summary: Remove member from tenant
            description: |
                Removes a user's membership in the tenant. The global account is unaffected.

                **Requires:** Owner role (level 5).
            operationId: removeTenantMember
            security:
                - bearerAuth: []
            parameters:
                - $ref: '#/components/parameters/TenantId'
                - $ref: '#/components/parameters/AccountId'
            responses:
                '200':
                    description: Member removed
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessResponse'
                '401':
                    $ref: '#/components/responses/UnauthorizedError'
                '403':
                    $ref: '#/components/responses/ForbiddenError'
                '404':
                    $ref: '#/components/responses/NotFoundError'
                '500':
                    $ref: '#/components/responses/ServerError'

components:
    # ===== SECURITY SCHEMES =====
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: |
                JWT token from login or registration.

                Format: `Bearer <token>`

                Expiry: 14 days

    # ===== PARAMETERS =====
    parameters:
        UserId:
            name: id
            in: path
            required: true
            schema:
                type: integer
            description: User ID

        TenantId:
            name: tenantId
            in: path
            required: true
            schema:
                type: string
            description: Tenant identifier (e.g., "tcss460-sp26")
            example: tcss460-sp26

        ClientId:
            name: clientId
            in: path
            required: true
            schema:
                type: string
            description: OAuth client ID

        AccountId:
            name: accountId
            in: path
            required: true
            schema:
                type: integer
            description: Account ID of the tenant member

    # ===== SCHEMAS =====
    schemas:
        RegisterRequest:
            type: object
            required:
                - firstname
                - lastname
                - email
                - username
                - password
                - phone
            properties:
                firstname:
                    type: string
                    minLength: 1
                    maxLength: 100
                    example: John
                lastname:
                    type: string
                    minLength: 1
                    maxLength: 100
                    example: Doe
                email:
                    type: string
                    format: email
                    example: john.doe@example.com
                username:
                    type: string
                    minLength: 3
                    maxLength: 50
                    pattern: '^[a-zA-Z0-9_-]+$'
                    example: johndoe
                password:
                    type: string
                    format: password
                    minLength: 8
                    maxLength: 128
                    example: SecurePass123!
                phone:
                    type: string
                    pattern: '^\d{10,}$'
                    example: '2065551234'

        AdminCreateUserRequest:
            allOf:
                - $ref: '#/components/schemas/RegisterRequest'
                - type: object
                  required:
                      - role
                  properties:
                      role:
                          type: integer
                          minimum: 1
                          maximum: 5
                          description: User role (1-5)
                          example: 2

        LoginRequest:
            type: object
            required:
                - email
                - password
            properties:
                email:
                    type: string
                    format: email
                    example: john.doe@example.com
                password:
                    type: string
                    format: password
                    example: SecurePass123!

        AuthResponse:
            type: object
            properties:
                success:
                    type: boolean
                    example: true
                message:
                    type: string
                    example: Login successful
                data:
                    type: object
                    properties:
                        accessToken:
                            type: string
                            description: JWT access token
                            example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                        user:
                            $ref: '#/components/schemas/UserInfo'

        UserInfo:
            type: object
            properties:
                id:
                    type: integer
                    example: 123
                email:
                    type: string
                    format: email
                    example: john.doe@example.com
                name:
                    type: string
                    example: John
                lastname:
                    type: string
                    example: Doe
                username:
                    type: string
                    example: johndoe
                role:
                    type: string
                    enum: [User, Moderator, Admin, SuperAdmin, Owner]
                    example: User
                emailVerified:
                    type: boolean
                    example: false
                phoneVerified:
                    type: boolean
                    example: false
                accountStatus:
                    type: string
                    enum: [pending, active, suspended, locked, deleted]
                    example: pending

        UserDetails:
            allOf:
                - $ref: '#/components/schemas/UserInfo'
                - type: object
                  properties:
                      firstName:
                          type: string
                          example: John
                      lastName:
                          type: string
                          example: Doe
                      phone:
                          type: string
                          example: '2065551234'
                      roleLevel:
                          type: integer
                          minimum: 1
                          maximum: 5
                          example: 1
                      createdAt:
                          type: string
                          format: date-time
                          example: '2024-01-15T10:30:00Z'
                      updatedAt:
                          type: string
                          format: date-time
                          example: '2024-01-15T10:30:00Z'

        # ===== OAUTH2 SCHEMAS =====
        OAuthTokenResponse:
            type: object
            properties:
                access_token:
                    type: string
                    description: JWT access token
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                token_type:
                    type: string
                    example: Bearer
                expires_in:
                    type: integer
                    description: Token lifetime in seconds
                    example: 3600
                refresh_token:
                    type: string
                    description: Refresh token for obtaining new access tokens
                    example: rt_abc123def456...

        OAuthErrorResponse:
            type: object
            properties:
                error:
                    type: string
                    description: OAuth2 error code
                    example: invalid_grant
                    enum:
                        - invalid_request
                        - invalid_client
                        - invalid_grant
                        - unauthorized_client
                        - unsupported_grant_type
                        - invalid_token
                error_description:
                    type: string
                    description: Human-readable error description
                    example: 'Authorization code has expired or has already been used'

        OAuthUserInfo:
            type: object
            properties:
                sub:
                    type: string
                    description: Unique user identifier (Account ID as string)
                    example: '42'
                email:
                    type: string
                    format: email
                    example: student@example.com
                name:
                    type: string
                    description: User's full name
                    example: 'Jane Doe'
                role:
                    type: string
                    description: User's role in the tenant
                    enum: [User, Moderator, Admin, SuperAdmin, Owner]
                    example: User
                tenant:
                    type: string
                    description: Tenant ID associated with the OAuth client
                    example: tcss460-sp26

        # ===== TENANT SCHEMAS =====
        Tenant:
            type: object
            properties:
                tenantId:
                    type: string
                    example: tcss460-sp26
                tenantName:
                    type: string
                    example: 'TCSS 460 Spring 2026'
                description:
                    type: string
                    example: 'Client/Server Programming course'
                isActive:
                    type: boolean
                    example: true
                autoProvision:
                    type: boolean
                    description: Whether to auto-create membership when user logs in via OAuth
                    example: true
                defaultRole:
                    type: integer
                    minimum: 1
                    maximum: 5
                    description: Default role for auto-provisioned members
                    example: 1
                brandingName:
                    type: string
                    description: Display name for the login page
                    example: 'TCSS 460'
                brandingColor:
                    type: string
                    description: Primary brand color (hex)
                    example: '#4B2E83'
                createdAt:
                    type: string
                    format: date-time

        CreateTenantRequest:
            type: object
            required:
                - tenantId
                - tenantName
            properties:
                tenantId:
                    type: string
                    description: Unique tenant identifier (slug format)
                    example: tcss460-au26
                tenantName:
                    type: string
                    example: 'TCSS 460 Autumn 2026'
                description:
                    type: string
                autoProvision:
                    type: boolean
                    default: true
                defaultRole:
                    type: integer
                    minimum: 1
                    maximum: 5
                    default: 1
                brandingName:
                    type: string
                brandingColor:
                    type: string

        OAuthClient:
            type: object
            properties:
                clientId:
                    type: string
                    example: tcss460-group1
                clientName:
                    type: string
                    example: 'Group 1 Consumer App'
                tenantId:
                    type: string
                    example: tcss460-sp26
                redirectUris:
                    type: array
                    items:
                        type: string
                        format: uri
                    example:
                        - http://localhost:3000/api/auth/callback/tcss460
                        - https://group1-app.onrender.com/api/auth/callback/tcss460
                createdAt:
                    type: string
                    format: date-time

        TenantMember:
            type: object
            properties:
                accountId:
                    type: integer
                    example: 42
                email:
                    type: string
                    format: email
                    example: student@example.com
                name:
                    type: string
                    example: 'Jane Doe'
                role:
                    type: integer
                    minimum: 1
                    maximum: 5
                    description: Tenant-specific role level
                    example: 1
                roleName:
                    type: string
                    enum: [User, Moderator, Admin, SuperAdmin, Owner]
                    example: User
                createdAt:
                    type: string
                    format: date-time
                    description: When the membership was created

        # ===== GENERAL SCHEMAS =====
        SuccessResponse:
            type: object
            properties:
                success:
                    type: boolean
                    example: true
                message:
                    type: string
                    example: Operation successful
                data:
                    type: object
                    nullable: true

        ErrorResponse:
            type: object
            properties:
                success:
                    type: boolean
                    example: false
                message:
                    type: string
                    example: Error message
                errorCode:
                    type: string
                    example: AUTH001

        ValidationErrorResponse:
            type: object
            properties:
                success:
                    type: boolean
                    example: false
                message:
                    type: string
                    example: Validation failed
                errors:
                    type: array
                    items:
                        type: object
                        properties:
                            field:
                                type: string
                                example: email
                            message:
                                type: string
                                example: Invalid email format

        PaginationMeta:
            type: object
            properties:
                page:
                    type: integer
                    example: 1
                limit:
                    type: integer
                    example: 20
                totalUsers:
                    type: integer
                    example: 150
                totalPages:
                    type: integer
                    example: 8

    # ===== RESPONSES =====
    responses:
        ValidationError:
            description: Validation error
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ValidationErrorResponse'

        UnauthorizedError:
            description: Authentication required
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    examples:
                        noToken:
                            value:
                                success: false
                                message: Auth token is not supplied
                                errorCode: AUTH009
                        invalidCredentials:
                            value:
                                success: false
                                message: Invalid credentials
                                errorCode: AUTH001

        ForbiddenError:
            description: Access forbidden
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    examples:
                        invalidToken:
                            value:
                                success: false
                                message: Token is not valid
                                errorCode: AUTH007
                        insufficientRole:
                            value:
                                success: false
                                message: Admin access required
                                errorCode: AUTH009
                        accountSuspended:
                            value:
                                success: false
                                message: Account is suspended. Please contact support.
                                errorCode: AUTH005

        NotFoundError:
            description: Resource not found
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    examples:
                        userNotFound:
                            value:
                                success: false
                                message: User not found
                                errorCode: USER001

        RateLimitError:
            description: Rate limit exceeded
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    examples:
                        tooManyRequests:
                            value:
                                success: false
                                message: Please wait before requesting again
                                errorCode: VRFY006

        ServerError:
            description: Internal server error
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ErrorResponse'
                    examples:
                        databaseError:
                            value:
                                success: false
                                message: Server error - contact support
                                errorCode: SRVR001
