    # ===== OAUTH2 ENDPOINTS =====
    /oauth/authorize:
        get:
            tags:
                - OAuth2
            summary: Authorization endpoint — shows login page
            description: |
                Initiates the OAuth2 Authorization Code Flow. Serves a hosted login/register page
                where the user enters credentials. On success, redirects back to the client's
                `redirect_uri` with an authorization code and the original `state`.

                **PKCE Support:** Include `code_challenge` and `code_challenge_method` for public clients.
            operationId: oauthAuthorizeGet
            parameters:
                - name: client_id
                  in: query
                  required: true
                  schema:
                      type: string
                  description: The OAuth client ID (issued per tenant)
                  example: tcss460-group1
                - name: redirect_uri
                  in: query
                  required: true
                  schema:
                      type: string
                      format: uri
                  description: Must match a registered redirect URI for the client
                  example: http://localhost:3000/api/auth/callback/tcss460
                - name: response_type
                  in: query
                  required: true
                  schema:
                      type: string
                      enum: [code]
                  description: Must be "code" for Authorization Code Flow
                - name: state
                  in: query
                  required: true
                  schema:
                      type: string
                  description: Opaque CSRF token — returned unchanged in the redirect
                  example: random123abc
                - name: code_challenge
                  in: query
                  schema:
                      type: string
                  description: PKCE code challenge (Base64url-encoded SHA256 hash of code_verifier)
                - name: code_challenge_method
                  in: query
                  schema:
                      type: string
                      enum: [S256, plain]
                  description: PKCE challenge method (S256 recommended)
            responses:
                '200':
                    description: HTML login/register page
                    content:
                        text/html:
                            schema:
                                type: string
                                description: Server-rendered login page with tenant branding
                '400':
                    description: Invalid request (missing or invalid parameters)
                    content:
                        application/json:
                            schema:
                                type: object
                                properties:
                                    error:
                                        type: string
                                        example: invalid_request
                                    error_description:
                                        type: string
                                        example: 'Missing required parameter: client_id'

        post:
            tags:
                - OAuth2
            summary: Submit login credentials and get authorization code
            description: |
                Processes the login form submission from the hosted login page. On success,
                redirects (302) to the client's `redirect_uri` with an authorization code
                and the original `state`. On failure, re-renders the login page with an error message.
            operationId: oauthAuthorizePost
            requestBody:
                required: true
                content:
                    application/x-www-form-urlencoded:
                        schema:
                            type: object
                            required:
                                - email
                                - password
                                - client_id
                                - redirect_uri
                                - state
                            properties:
                                email:
                                    type: string
                                    format: email
                                password:
                                    type: string
                                    format: password
                                client_id:
                                    type: string
                                redirect_uri:
                                    type: string
                                    format: uri
                                state:
                                    type: string
                                code_challenge:
                                    type: string
                                code_challenge_method:
                                    type: string
                                    enum: [S256, plain]
            responses:
                '302':
                    description: Redirect to redirect_uri with authorization code
                    headers:
                        Location:
                            schema:
                                type: string
                            description: 'redirect_uri?code=AUTH_CODE&state=STATE'
                '401':
                    description: Invalid credentials — re-renders login page with error
                    content:
                        text/html:
                            schema:
                                type: string

    /oauth/authorize/register:
        get:
            tags:
                - OAuth2
            summary: Registration page within OAuth flow
            description: |
                Serves a hosted registration page as part of the OAuth flow. Users who don't
                have an account can register here. On success, the new account is created,
                a tenant membership is provisioned, and the user is redirected back with an
                authorization code.
            operationId: oauthRegisterGet
            parameters:
                - name: client_id
                  in: query
                  required: true
                  schema:
                      type: string
                  description: The OAuth client ID
                - name: redirect_uri
                  in: query
                  required: true
                  schema:
                      type: string
                      format: uri
                  description: Must match a registered redirect URI
                - name: response_type
                  in: query
                  required: true
                  schema:
                      type: string
                      enum: [code]
                - name: state
                  in: query
                  required: true
                  schema:
                      type: string
                  description: Opaque CSRF token
                - name: code_challenge
                  in: query
                  schema:
                      type: string
                - name: code_challenge_method
                  in: query
                  schema:
                      type: string
                      enum: [S256, plain]
            responses:
                '200':
                    description: HTML registration page
                    content:
                        text/html:
                            schema:
                                type: string

        post:
            tags:
                - OAuth2
            summary: Register new account and get authorization code
            description: |
                Processes the registration form. Creates a new account, provisions tenant
                membership with the default role, and redirects to `redirect_uri` with
                an authorization code.
            operationId: oauthRegisterPost
            requestBody:
                required: true
                content:
                    application/x-www-form-urlencoded:
                        schema:
                            type: object
                            required:
                                - firstname
                                - lastname
                                - email
                                - username
                                - phone
                                - password
                                - confirmPassword
                                - client_id
                                - redirect_uri
                                - state
                            properties:
                                firstname:
                                    type: string
                                lastname:
                                    type: string
                                email:
                                    type: string
                                    format: email
                                username:
                                    type: string
                                phone:
                                    type: string
                                password:
                                    type: string
                                    format: password
                                confirmPassword:
                                    type: string
                                    format: password
                                client_id:
                                    type: string
                                redirect_uri:
                                    type: string
                                    format: uri
                                state:
                                    type: string
                                code_challenge:
                                    type: string
                                code_challenge_method:
                                    type: string
                                    enum: [S256, plain]
            responses:
                '302':
                    description: Redirect to redirect_uri with authorization code
                    headers:
                        Location:
                            schema:
                                type: string
                            description: 'redirect_uri?code=AUTH_CODE&state=STATE'
                '400':
                    description: Validation error — re-renders registration page
                    content:
                        text/html:
                            schema:
                                type: string

    /oauth/token:
        post:
            tags:
                - OAuth2
            summary: Exchange authorization code or refresh token for access token
            description: |
                Standard OAuth2 token endpoint. Supports two grant types:

                - **authorization_code**: Exchange an authorization code for an access token and refresh token.
                  Requires `code`, `redirect_uri`, `client_id`, `client_secret`. Include `code_verifier` if PKCE was used.
                - **refresh_token**: Exchange a refresh token for a new access token.
                  Requires `refresh_token`, `client_id`, `client_secret`.

                Client authentication is via `client_id` + `client_secret` in the request body.
            operationId: oauthToken
            requestBody:
                required: true
                content:
                    application/x-www-form-urlencoded:
                        schema:
                            type: object
                            required:
                                - grant_type
                                - client_id
                                - client_secret
                            properties:
                                grant_type:
                                    type: string
                                    enum: [authorization_code, refresh_token]
                                    description: The type of grant being requested
                                code:
                                    type: string
                                    description: Authorization code (required for authorization_code grant)
                                redirect_uri:
                                    type: string
                                    format: uri
                                    description: Must match the redirect_uri used in the authorize request
                                client_id:
                                    type: string
                                    description: The OAuth client ID
                                client_secret:
                                    type: string
                                    description: The OAuth client secret
                                code_verifier:
                                    type: string
                                    description: PKCE code verifier (required if code_challenge was used)
                                refresh_token:
                                    type: string
                                    description: Refresh token (required for refresh_token grant)
                        examples:
                            authorizationCode:
                                summary: Exchange authorization code
                                value:
                                    grant_type: authorization_code
                                    code: abc123def456
                                    redirect_uri: http://localhost:3000/api/auth/callback/tcss460
                                    client_id: tcss460-group1
                                    client_secret: secret123
                            refreshToken:
                                summary: Refresh access token
                                value:
                                    grant_type: refresh_token
                                    refresh_token: rt_abc123def456
                                    client_id: tcss460-group1
                                    client_secret: secret123
            responses:
                '200':
                    description: Token issued successfully
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OAuthTokenResponse'
                '400':
                    description: Invalid request
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OAuthErrorResponse'
                            examples:
                                invalidGrant:
                                    value:
                                        error: invalid_grant
                                        error_description: 'Authorization code has expired or has already been used'
                                invalidRequest:
                                    value:
                                        error: invalid_request
                                        error_description: 'Missing required parameter: code'
                '401':
                    description: Invalid client credentials
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OAuthErrorResponse'
                            examples:
                                invalidClient:
                                    value:
                                        error: invalid_client
                                        error_description: 'Client authentication failed'

    /oauth/userinfo:
        get:
            tags:
                - OAuth2
            summary: Get user profile from access token (OIDC-compatible)
            description: |
                Returns the authenticated user's profile based on the Bearer access token.
                Compatible with the OIDC UserInfo endpoint spec. The `sub` field is the
                user's unique account ID (as a string). The `role` and `tenant` fields
                reflect the user's role within the tenant associated with the OAuth client.
            operationId: oauthUserinfo
            security:
                - bearerAuth: []
            responses:
                '200':
                    description: User profile
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OAuthUserInfo'
                            examples:
                                studentProfile:
                                    value:
                                        sub: '42'
                                        email: student@example.com
                                        name: 'Jane Doe'
                                        role: User
                                        tenant: tcss460-sp26
                '401':
                    description: Invalid or expired token
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/OAuthErrorResponse'
                            examples:
                                invalidToken:
                                    value:
                                        error: invalid_token
                                        error_description: 'The access token is invalid or has expired'

